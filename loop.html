<html>
    <body>
        <h2>JavaScript for Loops</h2>
 <p id="result"></p>
        <script>
           fruits = ["Banana", "Orange", "Apple", "Mango"];
           var text = " "
           var i ;
           for (i=0 ; i<fruits.length ; i++)
              {
                text += fruits[i] + "<br>";
              }
              document.getElementById("result").innerHTML = text;
        </script>
    </body>
