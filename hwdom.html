<!doctype html>
<html>

<head>
    <title>My Zoo</title>
    <style>

body {

font-family: Arial, sans-serif;

background: rgb(32, 99, 158);

text-align: center;

padding: 30px;

}

h1 {

color: #0b2774;

}

#zoo {

border: 2px solid red;

width: 300px;

margin: 16px auto;

padding: 12px;

border-radius: 10px;

background: rgb(255, 255, 255);

}

.zone {

border: 1px solid black;

margin: 6px 0;

padding: 8px 12px;

border-radius: 20px;

text-align: left;

}

button {

background: lightblue;

color: white;

padding: 10px 24px;

border: none;

border-radius: 20px;

cursor: pointer;

}

</style>

</head>
</html>
<body>
    <h1>My Zoo</h1>
    <p> Use JavaScript and the Dom to add animals to each cage!</p>
    <div id="zoo">
        <div class="zone">Zone 1:<span id="zone1"></span> </div>
        <div class="zone">Zone 2:<span id="zone2"></span> </div>
         <div class="zone">Zone 3:<span id="zone3"></span> </div>
         <div class="zone">Zone 4:<span id="zone4"></span> </div>
         <div class="zone">Zone 5:<span id="zone5"></span> </div>
        <div class="zone">Total Animals:<span id="total"></span> </div>
         </div>
         <br>
         <button onclick="openZoo()">Open the Zoo</button>

         <p id="zoo-status"></p>
         <script>
function openZoo()
{
    document.getElementById("zone1").innerHTML ="crocodile";
    document.getElementById("zone2").innerHTML ="Monkey";
    document.getElementById("zone3").innerHTML ="Black panther";
    document.getElementById("zone4").innerHTML ="jaguar";
    document.getElementById("zone5").innerHTML ="Goats";
    document.getElementById("total").innerHTML ="5";
document.getElementById("zoo").style.backgroundColor = "lightgreen";
document.getElementById("zoo-status").innerHTML = "The zoo is now open!";
}
            </script>
            </body>
</html>
