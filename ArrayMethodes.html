<html>

<body>
    <h1>Array Methods</h1>
<p id="myjoin"></p>
<p id="myfruits"></p>
<p id="myfruits1"></p>


<script>
    var fruits = ["Lichi", "Pineapple", "Watermelon", "Mango"];
    document.getElementById("myjoin").innerHTML =fruits.join(" *");
    document.getElementById("myfruits").innerHTML =fruits;
    fruits.pop()
    document.getElementById("myfruits1").innerHTML =fruits;
</script>

</body>
</html>
