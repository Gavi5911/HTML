<html>
    <body>
        <h2>JavaScript My Fav Veggies</h2>
 <p id="result"></p>
        <script>
           Vegetable = ["Paprika", "broccoli", "Cucumber", "Carrot"];
           var text = " "
           var i ;
           for (i=0 ; i<Vegetable.length ; i++)
              {
                text += Vegetable[i] + "<br>";
              }
              document.getElementById("result").innerHTML = text;
        </script>
    </body>   
</html>
